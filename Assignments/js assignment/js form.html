<!DOCTYPE html>
<html>
<head>
  <title>Student Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="form.js" defer></script>
</head>
<body class="container mt-5" style="max-width:500px">

  <h3>Student Registration</h3>

  <form id="regForm">
    <label>Student name :</label>
    <input type="text" id="studentName" class="form-control mb-2 field" placeholder="enter your name">
    <label>Student email :</label>
    <input type="email" id="email" class="form-control mb-2 field" placeholder=" enter your email">
     <label>Student department :</label>
    <select id="dept" class="form-select mb-2 field">
      <option value="">Select Department</option>
      <option>CS</option>
      <option>IT</option>
      <option>ECE</option>
      <option>EEE</option>
    </select>

    <button class="btn btn-primary">Register</button>
  </form>

  <div id="result" class="p-3 mt-3"></div>
</body>
</html>
