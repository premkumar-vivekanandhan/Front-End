
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management</title>
    <link rel="stylesheet" href="js project.css">
</head>
<body>

    <div class="container">
        <h1>Product Management</h1>

        <div class="input-section">
            <input type="text" id="productInput"
                   placeholder="Enter product name">

            <button id="addBtn">Add Product</button>
            <button id="startBtn">Add First</button>
        </div>

        <h2>Product List</h2>

        <!-- Parent Div -->
        <div id="productContainer">

            <p class="product">Laptop</p>
            <p class="product">Mobile</p>
            <p class="product">Headphones</p>
            <p class="product">Keyboard</p>

        </div>

        <h3 id="total"></h3>

        <div id="details">
            <h3>Selected Product</h3>
            <p id="selected">No product selected</p>
            <p id="navigation">Navigation: None</p>
        </div>

        <p class="help">
            Click = Select | Double Click = Delete
            <br>
            Mouse Over = Change Color
        </p>
    </div>

    <script src="js project.js"></script>
</body>
</html>
