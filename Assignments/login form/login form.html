<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="style.css">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
        <div>
            <img class="bg" src="bg.avif">
             <img class="bg1" src="bg1.jpg">
        </div>
    <div class="container">
      <div class="row">
        <div class="col-6">
           <img class="lap" src="lap.jpeg">
        </div>
        <div class="row justify-content-center">
        <div class="col-6 mt-5">
         <form>
            <div>
                <label for="name" class="form-label text-white">STUDENT NAME</label>
                <input id="name" type="text" placeholder="Enter your name" required class="form-control rounded-4 p-2 w-75">
            </div>
            <div>
                <label for="name" class="form-label text-white">COMPANY NAME</label>
                <input id="company name" type="text" placeholder="Enter your company name" required class="form-control rounded-4 p-2 w-75">
            </div>
            <div>
                <label for="name" class="form-label text-white">PHONE NUMBER</label>
                <input id="phone number" type="number" placeholder="Enter your phone number" required  class="form-control rounded-4 p-2 w-75">
            </div>
            <div>
                <label for="name" class="form-label text-white">EMAIL ADDRESS</label>
                <input id="email" type="email" placeholder="Enter your email" required class="form-control rounded-4 p-2 w-75">
            </div>
            <div>
                <label for="name" class="form-label text-white">MESSAGE SUBJECT</label>
                <input id="s.msg" type="text" placeholder="subject of your message" required class="form-control rounded-4 p-2 w-75">
            </div>
            <div>
                <label for="name" class="form-label text-white">MESSAGE</label>
                <textarea placeholder="enter your message here" class="form-control rounded-4 p-3 w-75">
                </textarea>
            </div>
            <div>
                 <button type="message"
                                    class="btn btn-primary w-75 mt-4 p-3">
                                SEND MESSAGE
                            </button>
            </div>
            </div>
         </form>
        </div>
      </div>
      </div>
    </div>
    
</body>
</html>
