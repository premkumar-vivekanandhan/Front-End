<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operators</title>
    <script>
        console.log("1.ARITHMETIC OPERATOR")
       var a=50;
       var b=30;
       console.log(a+b);
       console.log(a-b);
       console.log(a*b);
       console.log(a/b);
       console.log(a%b);
       //pre-increament and decreament
       console.log(++a);
       console.log(--a);
       //post-increament and decreament
       console.log(b--);
       console.log(b);
       console.log(b++);
       console.log(b);
       console.log("2.ASSIGNMENT OPERATOR")
       a=20;
       b=70;
       console.log(a+=6);
       console.log(b-=9);
       console.log(a*=2);
       console.log(a**=2);
       console.log(a/=2);
       console.log(b%=4);
       console.log("3.COMPARISON OPERATOR");
       a=54;
       b=24;
       console.log(a<b);
       console.log(a>=b);
       console.log(b===10);
       console.log(a!==34);
       a="prem"
       b="raja"
       console.log("prem"==="raja");
       console.log("prem"!=="raja");
       console.log("4.LOGICAL OPERATOR");
       //and opperater both values or same(true+true=true)
      let mysalary=true;
      let myexpence=true;
      // or operator any one value of true(true+false=true)
      console.log(mysalary && myexpence);
      console.log(mysalary || myexpence);
      // not operator is opposite(false=true,true=false)
      console.log(mysalary != myexpence);
    </script>
</head>

</body>
</html>
