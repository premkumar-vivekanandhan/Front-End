<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid system</title>
    <style>
        p{
            background-color: blue;
            text-align: center;
            /* height: 100px;
            width: 100px; */
            align-content: center;
            border: 2px solid green;
        }
        .grid{
            border: 2px solid black;
            display: grid;
            height: 600px;
            width: 100%;
            grid-template-columns: 100px 100px 100px;
            grid-template-rows: 100px 100px 100px 200px;
            row-gap: 10px;
            column-gap: 10px;
            justify-content: center;
            /* left to right => change outside border=> left to right */
            align-content: center;
            /* top to bottom=>change outside border=>  */
            /* justify-items: end; */
            /* inside the border=> left to right */
            /* align-items: center; */
            /* top to bottom=> inside the border */
            grid-template-columns: repeat(autofit),minmax(100px,1fr)
        }
        *{
            margin: 0px;
        }
        .box1{
            grid-column: 3 span;
        }
        .box8{
            grid-row: 1 span;
        }
        .box11{
grid-area: a1;
        }
        
        .box12{
            grid-area: a2;
        }
        .box14{
            grid-area: a3;
        }
        .box15{
            grid-area: a4;
        }
        .box16{
            grid-area: a5;
        }
        .box17{
            grid-area: a6;
        }
        .box18{
            grid-area: a7;
        }
    </style>
</head>
<body>
     <div class="grid">
<p class="box1">1</p>
<p class="box2">2</p>
<p class="box3">3</p>
<p class="box4">4</p>
<p class="box5">5</p>
<p class="box6">6</p>
<p class="box7">7</p>
<p class="box8">8</p>
<p class="box9">9</p>
<p class="box10">10</p>
    </div>
    <div class="grid-areas">
        <p class="box11"></p>
        <p class="box12"></p>
        <p class="box13"></p>
        <p class="box14"></p>
        <p class="box15"></p>
        <p class="box16"></p>
        <p class="box17"></p>
        <p class="box18"></p>
        <p class="box19"></p>
        <p class="box20"></p>
        
    </div>
</body>
</html>
