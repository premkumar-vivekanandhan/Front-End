<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Quary</title>
    <style>
         @media screen and (max-width:600px){
        h1{
            color: red;
        }
    }
        @media screen and (max-width:800px){
            h1{
                color: blue;
            }
        }
            @media screen and (max-width:1000px){
            h1{
                color: yellow;
            }
        }
    </style>
</head>
<body>
    <h1>PremKumar</h1>
</body>
</html>
