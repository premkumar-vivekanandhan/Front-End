<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transaction and animation</title>
    <style>
        .box{
            background-color: chartreuse;
            width: 100%;
            height: 50px;
             text-align: center;
             align-content: center;
             transition: 10s;

        }
        .box:hover{
            background-color: rgb(68, 25, 226);
            width: 100px;
           box-shadow: 7px 7px 7px 7px;
        }
        .box2{
            background-color: chartreuse;
            width: 100px;
            height: 50px;
             text-align: center;
             align-content: center;
             animation-name: box2 ;
             animation-duration: 10s;
             animation-delay: 2s;
             animation-timing-function: ease;
             animation-iteration-count: 2;
             animation-fill-mode: forwards;

        }
        @keyframes box2{
            10%{
               background-color: orange;  
               margin-left: 200px;
            }
            20%{
                background-color: black;
                margin-top: 300px;
            }
            50%{
                background-color: aqua;
                margin-bottom: 400px;
            }
            80%{
                background-color: blueviolet;
                margin-right: 200px;
            }
        }
        
    </style>
</head>
<body>
    <h1>Transaction</h1>
    <h4 class="box">Premkumar</h4>
    <h1>Animation</h1>
    <h4 class="box2">Premkumar</h4>
</body>
</html>
