<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>
    <style>
        .flex{

            display: flex;
            gap: 5px;
            flex-direction:row-reverse;
           border: 6px solid rgb(11, 230, 95);
           height: 500px;
           justify-content: center;
           align-items: start;
        }
        p{
            background-color: rgb(87, 191, 218);
        }
    </style>
</head>
<body>
    <div class="flex">
        <p>1</p>
        <p>2</p>
        <p>3</p>
        <p>4</p>
        <p>5</p>
        <p>6</p>
        <p>7</p>
        <p>8</p>
        <p>9</p>
        <p>10</p>
    </div>
</body>
</html>
