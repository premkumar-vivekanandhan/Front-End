<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Intro</title>
    <link rel="stylesheet" href="Css intro.css">
    <style>
        p{
            background-color: yellow;
        }
        h2{
            background-color: aquamarine;
            margin: 80px 700px 50px 50px;
            border-top: 20px solid rgb(236, 26, 61) ;
            border-right:10px solid black ;
            border-left: 25px solid green;
            border-bottom: 17px solid yellow;
            padding: 100px;
            text-align: center;
            border-radius: 40px;
            box-shadow: 10px 6px 8px 10px blue;
            text-shadow: 15px 10px 1px rgb(14, 70, 226);
        }
        h2:hover{
background-color: violet;
text-align: right;
        }
    </style>
</head>
<body>
   <p style="background-color: brown;">Premkumar</p>
   <h1>Box Model</h1>
   <h2>Prem Kumar</h2>
</body>
</html>
