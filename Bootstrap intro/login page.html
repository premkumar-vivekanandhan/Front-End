<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <div class="conainer">
        <div class="row">
<div class="col-6">
<img src="student img.jpeg" class="w-100">
</div>
<div class="col-6 mt-5">

            <div class="col-md-6">

                <div class="card shadow">
                    <div class="card-header bg-success text-white text-center">
                        <h3>Student Registration</h3>
                    </div>

                    <div class="card-body p-4">
                        <form>
                            <div class="mb-1">
                                <label for="name" class="form-label">
                                    Student Name
                                </label>
                                <input type="text" id="name"
                                       class="form-control"
                                       placeholder="Enter your name"
                                       required>
                            </div>

                            <div class="mb-1">
                                <label for="email" class="form-label">
                                    Email Address
                                </label>
                                <input type="email" id="email"
                                       class="form-control"
                                       placeholder="Enter your email"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    Password
                                </label>
                                <input type="password" id="password"
                                       class="form-control"
                                       placeholder="Enter your password"
                                       required>
                            </div>

                            <button type="submit"
                                    class="btn btn-primary w-100">
                                    <a href="success login.html"><h5 class="text-black fs-5">Register Now</h5></a>    
                            </button>

                            <h5 class="fs-6 text-center">(or)</h5>

                            <button type="sign up"
                            class="btn btn-warning w-100">
                        <a href="new register page.html"><h4 class="text-black fs-6">New register</h4></a> 
                        </button>
                        </form>
                    </div>

                </div>

            </div>
        </div>
    </div>
</div>
        </div>
    </div>
</body>
</html>
